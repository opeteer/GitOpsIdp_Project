apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-idp-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/opeteer/GitOpsIdp_Project.git
    targetRevision: HEAD
    path: gitops/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: idp-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
