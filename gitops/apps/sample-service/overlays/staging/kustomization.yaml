apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idp-staging

resources:
  - ../../base

namePrefix: staging-

patches:
  - target:
      kind: Deployment
      name: sample-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/opeteer/sample-service:rc-latest

configMapGenerator:
  - name: sample-service-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=info
