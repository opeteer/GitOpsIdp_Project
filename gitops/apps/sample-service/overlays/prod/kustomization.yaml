apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idp-prod

resources:
  - ../../base
  - hpa.yaml

namePrefix: prod-

patches:
  - target:
      kind: Deployment
      name: sample-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/opeteer/sample-service:v1.0.0

configMapGenerator:
  - name: sample-service-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=warn
