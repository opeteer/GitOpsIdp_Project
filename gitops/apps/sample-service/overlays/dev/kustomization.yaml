apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idp-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - target:
      kind: Deployment
      name: sample-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/opeteer/sample-service:dev-latest

configMapGenerator:
  - name: sample-service-config
    behavior: merge
    literals:
      - APP_ENV=development
      - LOG_LEVEL=debug
